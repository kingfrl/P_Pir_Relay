<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        button { width: 80%; padding: 10px; margin: 10px 0; font-size: 16px; }
        .success { background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Connexion réussie !</h2>
    <div class="success">Identifiants sauvegardés.</div>
    <p>Connectez-vous maintenant au réseau WiFi de votre maison.</p>
    <p>Puis tapez l'adresse : <b>%IP%</b></p>
    <form action="/reboot" method="GET"><button type="submit">Rebooter l'ESP</button></form>
    <form action="/reset" method="GET"><button type="submit" style="background-color:#f8d7da;color:#721c24;">Oublier ce réseau</button></form>
</body>
</html>
